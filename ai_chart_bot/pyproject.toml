[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-chart-bot"
version = "0.1.0"
description = "AI-based CLI bot that detects chart patterns and suggests actions"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pandas~=2.2",
    "numpy~=1.26",
    "yfinance~=0.2.52",
    "scikit-learn~=1.5",
    "ta~=0.11.0",
    "click~=8.1",
]

[project.scripts]
ai-chart-bot = "ai_chart_bot.cli:main"

